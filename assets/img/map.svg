<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">山有小厨位置示意图</title>
  <desc id="mapDesc">餐厅位于北二经街79号，从青年大街地铁站C口步行约460米。</desc>
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E9DA"/>
      <stop offset="1" stop-color="#E7DAC6"/>
    </linearGradient>
    <linearGradient id="pinFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B85C3C"/>
      <stop offset="1" stop-color="#8E3D23"/>
    </linearGradient>
    <filter id="mapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5C4430" flood-opacity="0.22"/>
    </filter>
    <filter id="pinShadow" x="-50%" y="-30%" width="200%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4A2A1A" flood-opacity="0.35"/>
    </filter>
    <clipPath id="mapClip"><rect width="900" height="720" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#mapClip)">
    <rect width="900" height="720" fill="url(#mapBg)"/>

    <!-- block texture -->
    <g opacity="0.38" fill="none" stroke="#C9B79E" stroke-width="1">
      <path d="M0 96h900M0 214h900M0 332h900M0 450h900M0 568h900M0 686h900"/>
      <path d="M96 0v720M214 0v720M332 0v720M450 0v720M568 0v720M686 0v720M804 0v720"/>
    </g>

    <!-- city blocks -->
    <g fill="#DDD0BC" stroke="#CDBBA2" stroke-width="1.5">
      <rect x="44" y="64" width="232" height="112" rx="5"/>
      <rect x="44" y="208" width="112" height="92" rx="5"/>
      <rect x="188" y="208" width="88" height="92" rx="5"/>
      <rect x="44" y="344" width="232" height="166" rx="5"/>
      <rect x="44" y="544" width="112" height="118" rx="5"/>
      <rect x="188" y="544" width="88" height="118" rx="5"/>
      <rect x="354" y="64" width="142" height="112" rx="5"/>
      <rect x="534" y="64" width="98" height="112" rx="5"/>
      <rect x="354" y="208" width="142" height="92" rx="5"/>
      <rect x="354" y="344" width="142" height="166" rx="5"/>
      <rect x="354" y="544" width="142" height="118" rx="5"/>
      <rect x="704" y="64" width="150" height="112" rx="5"/>
      <rect x="704" y="208" width="150" height="92" rx="5"/>
      <rect x="704" y="344" width="150" height="166" rx="5"/>
      <rect x="704" y="544" width="150" height="118" rx="5"/>
    </g>

    <!-- small buildings -->
    <g fill="#D4C5AF" opacity="0.9">
      <rect x="62" y="82" width="76" height="34" rx="3"/>
      <rect x="154" y="82" width="100" height="52" rx="3"/>
      <rect x="62" y="128" width="60" height="32" rx="3"/>
      <rect x="372" y="82" width="54" height="72" rx="3"/>
      <rect x="442" y="96" width="38" height="58" rx="3"/>
      <rect x="722" y="82" width="54" height="72" rx="3"/>
      <rect x="790" y="82" width="44" height="40" rx="3"/>
      <rect x="64" y="366" width="70" height="54" rx="3"/>
      <rect x="150" y="366" width="100" height="42" rx="3"/>
      <rect x="374" y="366" width="46" height="112" rx="3"/>
      <rect x="434" y="386" width="44" height="76" rx="3"/>
      <rect x="724" y="366" width="50" height="86" rx="3"/>
      <rect x="788" y="366" width="48" height="54" rx="3"/>
    </g>

    <!-- park -->
    <g>
      <rect x="202" y="612" width="74" height="50" rx="8" fill="#B9C29A" opacity="0.8"/>
      <g fill="#84936A" opacity="0.8">
        <circle cx="219" cy="631" r="8"/>
        <circle cx="240" cy="640" r="10"/>
        <circle cx="260" cy="628" r="7"/>
        <circle cx="254" cy="650" r="6"/>
      </g>
    </g>

    <!-- major road: 青年大街 -->
    <g>
      <rect x="622" y="-10" width="82" height="740" fill="#D2C0A9"/>
      <rect x="626" y="-10" width="74" height="740" fill="#F8F1E5"/>
      <path d="M663 -10v740" stroke="#C8B69D" stroke-width="3" stroke-dasharray="14 12"/>
      <path d="M640 -10v740M686 -10v740" stroke="#E3D6C4" stroke-width="1.5"/>
      <text x="674" y="150" transform="rotate(-90 674 150)" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="21" letter-spacing="5" fill="#766650">青年大街</text>
    </g>

    <!-- secondary road: 北二经街 -->
    <g>
      <rect x="-10" y="318" width="920" height="52" fill="#D8C7B1"/>
      <rect x="-10" y="322" width="920" height="44" fill="#FAF4E9"/>
      <path d="M0 344h900" stroke="#CCBAA2" stroke-width="2.5" stroke-dasharray="12 10"/>
      <text x="104" y="313" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19" letter-spacing="4" fill="#766650">北二经街</text>
    </g>

    <!-- lane: 风雨坛街道 -->
    <g>
      <rect x="-10" y="518" width="920" height="28" fill="#DCCDB9"/>
      <rect x="-10" y="522" width="920" height="20" fill="#F6EFE2"/>
      <text x="746" y="510" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" letter-spacing="3" fill="#88785F">风雨坛街道</text>
    </g>

    <!-- crosswalks -->
    <g stroke="#D9CBB7" stroke-width="3" opacity="0.8">
      <path d="M632 328h62M632 336h62M632 352h62M632 360h62"/>
      <path d="M622 520h82M622 527h82"/>
    </g>

    <!-- metro station -->
    <g>
      <circle cx="704" cy="368" r="20" fill="#F8F1E5" stroke="#A94E30" stroke-width="2"/>
      <g fill="none" stroke="#A94E30" stroke-width="2" stroke-linecap="round">
        <rect x="696" y="357" width="16" height="16" rx="4"/>
        <path d="M699 377l2-4M709 377l-2-4M696 365h16M701 370h.01M707 370h.01"/>
      </g>
      <text x="704" y="410" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" letter-spacing="1" fill="#6F5F4B">青年大街站</text>
      <text x="704" y="426" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" letter-spacing="1" fill="#88785F">C 口</text>
    </g>

    <!-- walking route -->
    <path d="M690 368 C610 366 560 344 500 342 C438 340 398 330 350 330" fill="none" stroke="#A94E30" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.85"/>
    <path d="M690 368 C610 366 560 344 500 342 C438 340 398 330 350 330" fill="none" stroke="#A94E30" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.12"/>
    <g transform="translate(520 348)">
      <rect x="-51" y="-17" width="102" height="26" rx="13" fill="#F8F1E5" opacity="0.95"/>
      <text x="0" y="1" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" letter-spacing="1" fill="#8B4B32">步行约 460 米</text>
    </g>

    <!-- restaurant pin -->
    <g transform="translate(350 300)" filter="url(#pinShadow)">
      <path d="M0 42C0 42-34 10-34-16A34 34 0 1 1 34-16C34 10 0 42 0 42Z" fill="url(#pinFill)"/>
      <circle cx="0" cy="-16" r="14" fill="#F8F1E5"/>
      <path d="M-7-11 0-21l6 8 5-6 4 12" fill="none" stroke="#A94E30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="10" cy="-20" r="1.6" fill="#A94E30"/>
    </g>

    <!-- restaurant label -->
    <g transform="translate(350 360)" filter="url(#mapShadow)">
      <rect x="-82" y="-13" width="164" height="58" rx="9" fill="#FBF7EF" stroke="#D8C7B1"/>
      <text x="0" y="8" text-anchor="middle" font-family="'Noto Serif SC','SimSun',serif" font-size="20" letter-spacing="2" fill="#23211C">山有小厨</text>
      <text x="0" y="28" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" letter-spacing="1.5" fill="#7E6E58">北二经街 79 号</text>
    </g>

    <!-- compass -->
    <g transform="translate(818 650)">
      <circle r="28" fill="#F8F1E5" opacity="0.92"/>
      <path d="M0-18 5 2 0-2-5 2Z" fill="#A94E30"/>
      <text x="0" y="16" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" fill="#766650">北</text>
    </g>

    <!-- scale -->
    <g transform="translate(44 676)">
      <path d="M0 0h94" stroke="#8B7B66" stroke-width="2"/>
      <path d="M0-4v8M47-4v8M94-4v8" stroke="#8B7B66" stroke-width="2"/>
      <text x="47" y="22" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" fill="#766650">约 100 米</text>
    </g>

    <!-- top label -->
    <g transform="translate(44 40)">
      <text font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" letter-spacing="3" fill="#88785F">SHENYANG · SHENHE</text>
    </g>

    <rect width="900" height="720" fill="#5B4033" opacity="0.025"/>
  </g>
</svg>
